name: Apply v1.0.1 source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-v1.0.1.yml"

permissions:
  contents: write

concurrency:
  group: apply-v1.0.1-source
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            for part in 01 02 03 04 05 06 07 08 09; do
              git show 2f7462753bb0b05ba2f827531d713fe93f591a8c:.release/v1.0.1/part${part}
            done | base64 --decode > /tmp/oashttp-v1.0.1.patch
            echo "1601446a352fbd883c30dfdd44316be04b2576cd289c76ca852ec284ecd3803f  /tmp/oashttp-v1.0.1.patch" | sha256sum --check --strict
            git apply --index --whitespace=error /tmp/oashttp-v1.0.1.patch
            git diff --cached --check
            grep -qx 'const Version = "1.0.1"' version.go

            git rm .github/workflows/repair-v1.0.1.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "release: implement customizable failures in v1.0.1"
            git push origin HEAD:main
          ) > /tmp/apply-v1.0.1.log 2>&1
          status=$?
          set -e
          cat /tmp/apply-v1.0.1.log

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/apply-v1.0.1.log APPLY_V1.0.1_FAILED.log
            git add APPLY_V1.0.1_FAILED.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record v1.0.1 source apply failure"
            git push origin HEAD:main
            exit "$status"
          fi
