name: Finalize v2.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-v2.0.0.yml"

permissions:
  contents: write

concurrency:
  group: finalize-v2.0.0
  cancel-in-progress: true

jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9cca0977645b31a44c503db63e8003de30b06ce
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Verify and publish
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "a9cca0977645b31a44c503db63e8003de30b06ce"
            grep -qx 'module github.com/sevlumen/oashttp/v2' go.mod
            grep -qx 'const Version = "2.0.0"' version.go
            grep -q 'go get github.com/sevlumen/oashttp/v2@v2.0.0' README.md
            if git grep -n 'github.com/quang020102/go-osm' -- '*.go' go.mod '.github/**'; then
              echo 'legacy module path remains in executable source'
              exit 1
            fi
            if git grep -n 'https://github.com/sevlumen/oashttp/v2'; then
              echo 'repository URL incorrectly contains /v2'
              exit 1
            fi

            test -z "$(gofmt -l .)"
            go mod tidy
            git diff --exit-code -- go.mod go.sum
            test "$(go list -m all | wc -l | tr -d ' ')" = "1"
            go vet ./...
            go test ./... -shuffle=on -count=3
            go test -race ./...

            go test ./... -coverprofile=coverage.out
            coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            echo "total coverage: ${coverage}%"
            awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 70) exit 1 }'

            UPDATE_GOLDEN=1 go test ./examples/users-api -run TestUsersAPIEndToEnd/openapi_golden -count=1
            git diff --exit-code -- testdata/users.openapi.golden.json
            go test ./internal/route -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=15s
            go test ./internal/binding -run=^$ -fuzz=FuzzCompiledBinderNeverPanics -fuzztime=15s
            go test ./... -bench=. -run=^$ -benchtime=100ms
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
            govulncheck ./...

            if git ls-remote --exit-code --tags origin refs/tags/v2.0.0 >/dev/null 2>&1; then
              echo 'v2.0.0 already exists'
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v2.0.0 a9cca0977645b31a44c503db63e8003de30b06ce -m 'Release v2.0.0'
            git push origin refs/tags/v2.0.0
          ) > /tmp/finalize-v2.log 2>&1
          status=$?
          set -e
          cat /tmp/finalize-v2.log
          if [ "$status" -ne 0 ]; then
            git fetch origin main
            git checkout -B finalize-v2-diagnostics origin/main
            cp /tmp/finalize-v2.log FINALIZE_V2_FAILED.log
            git add FINALIZE_V2_FAILED.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: record v2.0.0 finalization failure'
            git push origin HEAD:main
            exit "$status"
          fi
