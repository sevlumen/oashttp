name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish v1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: d3afba846cddf98669d4b19c8ded7c51fb147b28
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Verify package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)"
          test "${package_version}" = "1.0.0"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./... -bench=. -run=^$ -benchtime=100ms
      - name: Create annotated release tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 d3afba846cddf98669d4b19c8ded7c51fb147b28 -m "Release v1.0.0"
          git push origin refs/tags/v1.0.0
