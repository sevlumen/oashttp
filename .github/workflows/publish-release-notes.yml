name: Publish detailed release notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release-notes.yml"

permissions:
  contents: write

concurrency:
  group: publish-release-notes
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          for tag in v1.0.0 v1.0.1 v2.0.0; do
            git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          done

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v1.0.0.md <<'EOF'
          ## Highlights

          `v1.0.0` is the first production-ready stable release of **oashttp**, a typed JSON HTTP and OpenAPI 3.1 library built on Go's standard `net/http` package with zero third-party runtime dependencies.

          ## What's new

          - Stable typed endpoint API with compiled request binding and validation.
          - OpenAPI 3.1 document generation and Swagger UI integration.
          - RFC 9457-style `ProblemDetails` error responses.
          - Authentication and authorization extension points.
          - Default outer panic recovery with error reporting through `Config.ErrorHandler`.
          - RFC 6750-compatible `WWW-Authenticate` responses for protected endpoints.
          - Automatic OpenAPI documentation for framework-generated `400`, `401`, `403`, `413`, `415`, and `500` responses.
          - ETag, conditional GET, and caching support for generated OpenAPI documents.
          - Secure Swagger initializer CSP using a SHA-256 hash instead of `unsafe-inline`.

          ## Reliability and behavior changes

          - OpenAPI output omits `jsonSchemaDialect`, allowing the OpenAPI 3.1 default dialect and avoiding Swagger UI warnings.
          - JSON is serialized before response headers are committed, preventing false success responses when encoding fails.
          - Oversized JSON request bodies return `413 Payload Too Large`.
          - Unsupported request media types return `415 Unsupported Media Type`.
          - Validation runs only after request binding succeeds.
          - Framework failures use `application/problem+json`, `Cache-Control: no-store`, and `X-Content-Type-Options: nosniff`.

          ## Quality gates

          The release is verified with formatting checks, `go vet`, shuffled tests, race detection, coverage enforcement, OpenAPI golden tests, fuzzing, benchmarks, and `govulncheck`.

          ## Install

          ```bash
          go get github.com/quang020102/go-osm@v1.0.0
          ```

          This release uses the original v1 module path. New projects should use the current v2 module described in the latest release.
          EOF

          cat > /tmp/v1.0.1.md <<'EOF'
          ## Highlights

          `v1.0.1` adds customizable error responses while preserving the default `ProblemDetails` behavior of `v1.0.0`.

          ## What's new

          - `Config.FailureFormatter` lets applications define the JSON body, media type, and OpenAPI schema used for framework-generated failures.
          - New public APIs: `Failure`, `Fail`, `FailureFormatter`, and `ProblemDetailsFormatter`.
          - `ErrorJSON` supports endpoint-specific JSON error envelopes.
          - `ProducesResponse` documents caller-defined response bodies and media types in OpenAPI.
          - Binding, validation, authentication, authorization, panic recovery, nil-result, and serialization failures now flow through the configured formatter.
          - Custom failure formatters register only their configured schema; the default `ProblemDetails` component is no longer exposed unnecessarily.

          ## OpenAPI change

          When `Config.Servers` is empty, the generated document now omits the `servers` field instead of injecting:

          ```json
          [{"url":"/","description":"Current server"}]
          ```

          OpenAPI clients still resolve requests against the current origin. Explicit servers remain supported through `Config.Servers`.

          ## Compatibility

          This release is backward-compatible within v1. The default formatter preserves the runtime and OpenAPI behavior of `v1.0.0`; all new public APIs are additive.

          ## Install

          ```bash
          go get github.com/quang020102/go-osm@v1.0.1
          ```

          **Full comparison:** https://github.com/sevlumen/oashttp/compare/v1.0.0...v1.0.1
          EOF

          cat > /tmp/v2.0.0.md <<'EOF'
          ## Highlights

          `v2.0.0` establishes the canonical repository and Go module identity for **oashttp** after the project was renamed and transferred.

          ## What's new

          - Canonical Go module path: `github.com/sevlumen/oashttp/v2`.
          - All internal imports, examples, CI badges, installation instructions, raw source links, and repository references now use `sevlumen/oashttp`.
          - The complete customizable-failure functionality introduced in `v1.0.1` is included unchanged.
          - The OpenAPI document continues to omit default `servers` and `jsonSchemaDialect` fields unless explicitly required.

          ## Breaking change

          The module path changed, so Go source imports must be updated:

          ```go
          // Before
          import oashttp "github.com/quang020102/go-osm"

          // After
          import oashttp "github.com/sevlumen/oashttp/v2"
          ```

          Then update the dependency:

          ```bash
          go get github.com/sevlumen/oashttp/v2@v2.0.0
          go mod tidy
          ```

          No application-level API redesign is required beyond replacing the import path. The major version increment is required by Go module semantic import versioning.

          ## Compatibility

          Applications that cannot migrate immediately may continue using `github.com/quang020102/go-osm@v1.0.1`. The v1 tag remains available and unchanged.

          ## Quality gates

          The canonical v2 source was verified with formatting, module tidiness, zero runtime dependency enforcement, `go vet`, shuffled tests, race detection, coverage enforcement, OpenAPI golden tests, route and binder fuzzing, benchmarks, and `govulncheck`.

          **Full comparison:** https://github.com/sevlumen/oashttp/compare/v1.0.1...v2.0.0
          EOF

      - name: Create or update GitHub releases
        shell: bash
        run: |
          set -euo pipefail

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            local latest="$4"

            if gh release view "$tag" >/dev/null 2>&1; then
              if [ "$latest" = "true" ]; then
                gh release edit "$tag" --title "$title" --notes-file "$notes" --latest
              else
                gh release edit "$tag" --title "$title" --notes-file "$notes" --latest=false
              fi
            else
              if [ "$latest" = "true" ]; then
                gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes" --latest
              else
                gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes" --latest=false
              fi
            fi
          }

          publish_release v1.0.0 "oashttp v1.0.0 — First stable production release" /tmp/v1.0.0.md false
          publish_release v1.0.1 "oashttp v1.0.1 — Custom failure responses" /tmp/v1.0.1.md false
          publish_release v2.0.0 "oashttp v2.0.0 — Canonical module path" /tmp/v2.0.0.md true

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-release-notes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-time release notes publisher"
          git push origin HEAD:main
