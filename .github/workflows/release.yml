name: Release verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./... -bench=. -run=^$ -benchtime=100ms
