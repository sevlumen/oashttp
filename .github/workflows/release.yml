name: Release

on:
  push:
    branches:
      - "publish/v*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./... -bench=. -run=^$ -benchtime=100ms

  publish:
    if: startsWith(github.ref, 'refs/heads/publish/v')
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#publish/}"
          package_version="$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)"
          test -n "$package_version"
          test "$tag" = "v${package_version}"

          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Verify zero runtime dependencies
        shell: bash
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          test -z "$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)"

      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run repeated tests
        run: go test ./... -shuffle=on -count=3

      - name: Run race detector
        run: go test -race ./...

      - name: Enforce coverage floor
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 70) exit 1 }'

      - name: Verify OpenAPI golden file
        shell: bash
        run: |
          UPDATE_GOLDEN=1 go test ./examples/users-api -run TestUsersAPIEndToEnd/openapi_golden -count=1
          git diff --exit-code -- testdata/users.openapi.golden.json

      - name: Fuzz route parser
        run: go test ./internal/route -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=15s

      - name: Fuzz compiled binder
        run: go test ./internal/binding -run=^$ -fuzz=FuzzCompiledBinderNeverPanics -fuzztime=15s

      - name: Run benchmarks
        run: go test ./... -bench=. -run=^$ -benchtime=100ms

      - name: Scan known Go vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "oashttp ${RELEASE_TAG}" \
            --generate-notes \
            --fail-on-no-commits

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "false"
