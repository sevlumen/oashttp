name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Verify zero dependencies
        shell: bash
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          test -z "$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test . -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=10s
      - run: go test ./... -bench=. -run=^$ -benchtime=100ms
