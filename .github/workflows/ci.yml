name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Verify zero runtime dependencies
        shell: bash
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          test -z "$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)"
      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./... -shuffle=on -count=3

  quality:
    name: Race, coverage, fuzz, benchmark, vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go test -race ./...
      - name: Enforce coverage floor
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 70) exit 1 }'
      - name: Verify OpenAPI golden file
        shell: bash
        run: |
          UPDATE_GOLDEN=1 go test ./examples/users-api -run TestUsersAPIEndToEnd/openapi_golden -count=1
          git diff --exit-code -- testdata/users.openapi.golden.json
      - run: go test ./internal/route -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=15s
      - run: go test ./internal/binding -run=^$ -fuzz=FuzzCompiledBinderNeverPanics -fuzztime=15s
      - run: go test ./... -bench=. -run=^$ -benchtime=100ms
      - name: Scan known Go vulnerabilities
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
