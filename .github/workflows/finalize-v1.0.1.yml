name: Finalize v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-v1.0.1.yml"

permissions:
  contents: write

concurrency:
  group: finalize-v1.0.1
  cancel-in-progress: true

jobs:
  verify-and-tag:
    name: Verify source and correct v1.0.1 tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf03bc5d6b482dd6eaa808dc8aa5de006c35d1fb
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Verify and tag or persist failure
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "bf03bc5d6b482dd6eaa808dc8aa5de006c35d1fb"
            grep -qx 'const Version = "1.0.1"' version.go
            test -z "$(gofmt -l .)"
            go mod tidy
            git diff --exit-code -- go.mod go.sum
            go vet ./...
            go test ./... -shuffle=on -count=3
            go test -race ./...

            go test ./... -coverprofile=coverage.out
            coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            echo "total coverage: ${coverage}%"
            awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 70) exit 1 }'

            UPDATE_GOLDEN=1 go test ./examples/users-api -run TestUsersAPIEndToEnd/openapi_golden -count=1
            git diff --exit-code -- testdata/users.openapi.golden.json
            go test ./internal/route -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=15s
            go test ./internal/binding -run=^$ -fuzz=FuzzCompiledBinderNeverPanics -fuzztime=15s
            go test ./... -bench=. -run=^$ -benchtime=100ms
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
            govulncheck ./...

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -d v1.0.1 || true
            git tag -a v1.0.1 bf03bc5d6b482dd6eaa808dc8aa5de006c35d1fb -m "Release v1.0.1"
            git push --force origin refs/tags/v1.0.1
          ) > /tmp/finalize-v1.0.1.log 2>&1
          status=$?
          set -e
          cat /tmp/finalize-v1.0.1.log

          if [ "$status" -ne 0 ]; then
            git fetch origin main
            git checkout -B finalize-diagnostics origin/main
            cp /tmp/finalize-v1.0.1.log FINALIZE_V1.0.1_FAILED.log
            git add FINALIZE_V1.0.1_FAILED.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record v1.0.1 finalization failure"
            git push origin HEAD:main
            exit "$status"
          fi
