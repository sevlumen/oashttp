name: Fix v2 installation docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-v2-readme.yml"

permissions:
  contents: write

concurrency:
  group: fix-v2-install-docs
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct install command
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            grep -q 'go get github.com/sevlumen/oashttp/v2@v1.0.1' README.md
            sed -i 's#go get github.com/sevlumen/oashttp/v2@v1.0.1#go get github.com/sevlumen/oashttp/v2@v2.0.0#' README.md
            if grep -n 'github.com/sevlumen/oashttp/v2@v1.0.1' README.md; then
              echo 'stale v1 tag remains on the v2 module path in README'
              exit 1
            fi
            git rm -f .github/workflows/fix-v2-readme.yml
            rm -f FIX_V2_README_FAILED.log
            git add -A
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: correct v2 installation command'
            git push origin HEAD:main
          ) > /tmp/fix-v2-readme.log 2>&1
          status=$?
          set -e
          cat /tmp/fix-v2-readme.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/fix-v2-readme.log FIX_V2_README_FAILED.log
            git add FIX_V2_README_FAILED.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: record v2 README fix failure'
            git push origin HEAD:main
            exit "$status"
          fi
