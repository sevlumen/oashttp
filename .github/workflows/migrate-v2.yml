name: Migrate module to v2.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-v2.yml"

permissions:
  contents: write

concurrency:
  group: migrate-module-v2
  cancel-in-progress: true

jobs:
  migrate:
    name: Verify and publish canonical v2 module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Migrate, verify, and publish
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail

            grep -qx 'module github.com/quang020102/go-osm' go.mod
            grep -qx 'const Version = "1.0.1"' version.go

            git grep -lz 'github.com/quang020102/go-osm' | xargs -0 -r sed -i 's#github.com/quang020102/go-osm#github.com/sevlumen/oashttp/v2#g'
            git grep -lz 'raw.githubusercontent.com/quang020102/go-osm' | xargs -0 -r sed -i 's#raw.githubusercontent.com/quang020102/go-osm#raw.githubusercontent.com/sevlumen/oashttp#g'
            git grep -lz 'https://github.com/sevlumen/oashttp/v2' | xargs -0 -r sed -i 's#https://github.com/sevlumen/oashttp/v2#https://github.com/sevlumen/oashttp#g'

            sed -i 's/^const Version = "1.0.1"$/const Version = "2.0.0"/' version.go

            python3 - <<'PY'
            from pathlib import Path

            changelog = Path("CHANGELOG.md")
            text = changelog.read_text()
            marker = "All notable changes to this project are documented here. The project follows Semantic Versioning.\n"
            section = """

            ## [2.0.0] - 2026-08-06

            ### Changed

            - Moved the canonical Go module to `github.com/sevlumen/oashttp/v2` after the repository transfer and rename.
            - Updated all internal imports, examples, badges, installation instructions, and repository links to the canonical location.

            ### Migration

            Version 2 is a breaking module-path migration. Replace imports from `github.com/quang020102/go-osm` with `github.com/sevlumen/oashttp/v2`. Version `v1.0.1` remains available at the legacy module path for existing applications.
            """
            if "## [2.0.0]" not in text:
                if marker not in text:
                    raise SystemExit("changelog marker not found")
                text = text.replace(marker, marker + section, 1)
                changelog.write_text(text)

            readme = Path("README.md")
            text = readme.read_text()
            anchor = "The Go module has no third-party runtime dependencies."
            migration = """

            ## Migrating from v1

            Version 2 uses the canonical module path `github.com/sevlumen/oashttp/v2`. Update imports and run:

            ```bash
            go get github.com/sevlumen/oashttp/v2@v2.0.0
            go mod tidy
            ```

            The legacy `github.com/quang020102/go-osm@v1.0.1` module remains available for applications that are not ready to migrate.
            """
            if "## Migrating from v1" not in text:
                if anchor not in text:
                    raise SystemExit("README migration anchor not found")
                text = text.replace(anchor, migration + "\n\n" + anchor, 1)
                readme.write_text(text)
            PY

            grep -qx 'module github.com/sevlumen/oashttp/v2' go.mod
            grep -qx 'const Version = "2.0.0"' version.go
            if git grep -n 'github.com/quang020102/go-osm' -- '*.go' go.mod '.github/**'; then
              echo "legacy module path remains in executable source"
              exit 1
            fi
            if git grep -n 'https://github.com/sevlumen/oashttp/v2'; then
              echo "repository URL incorrectly contains /v2"
              exit 1
            fi

            test -z "$(gofmt -l .)"
            go mod tidy
            git diff --exit-code -- go.mod go.sum
            go vet ./...
            go test ./... -shuffle=on -count=3
            go test -race ./...

            go test ./... -coverprofile=coverage.out
            coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            echo "total coverage: ${coverage}%"
            awk -v coverage="$coverage" 'BEGIN { if ((coverage + 0) < 70) exit 1 }'

            UPDATE_GOLDEN=1 go test ./examples/users-api -run TestUsersAPIEndToEnd/openapi_golden -count=1
            git diff --exit-code -- testdata/users.openapi.golden.json
            go test ./internal/route -run=^$ -fuzz=FuzzRouteParserNeverPanics -fuzztime=15s
            go test ./internal/binding -run=^$ -fuzz=FuzzCompiledBinderNeverPanics -fuzztime=15s
            go test ./... -bench=. -run=^$ -benchtime=100ms
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
            govulncheck ./...

            if git ls-remote --exit-code --tags origin refs/tags/v2.0.0 >/dev/null 2>&1; then
              echo "v2.0.0 already exists"
              exit 1
            fi

            git rm .github/workflows/migrate-v2.yml
            rm -f MIGRATE_V2_FAILED.log coverage.out
            git add -A
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "release: migrate canonical module path to v2.0.0"
            git tag -a v2.0.0 -m "Release v2.0.0"
            git push origin HEAD:main
            git push origin refs/tags/v2.0.0
          ) > /tmp/migrate-v2.log 2>&1
          status=$?
          set -e
          cat /tmp/migrate-v2.log

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/migrate-v2.log MIGRATE_V2_FAILED.log
            git add MIGRATE_V2_FAILED.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record v2 migration failure"
            git push origin HEAD:main
            exit "$status"
          fi
