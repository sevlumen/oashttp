name: Apply v2 module migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-module-v2
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical module path
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail

            grep -qx 'module github.com/quang020102/go-osm' go.mod
            grep -qx 'const Version = "1.0.1"' version.go

            git grep -lz 'github.com/quang020102/go-osm' | xargs -0 -r sed -i 's#github.com/quang020102/go-osm#github.com/sevlumen/oashttp/v2#g'
            git grep -lz 'raw.githubusercontent.com/quang020102/go-osm' | xargs -0 -r sed -i 's#raw.githubusercontent.com/quang020102/go-osm#raw.githubusercontent.com/sevlumen/oashttp#g'
            git grep -lz 'https://github.com/sevlumen/oashttp/v2' | xargs -0 -r sed -i 's#https://github.com/sevlumen/oashttp/v2#https://github.com/sevlumen/oashttp#g'

            sed -i 's/^const Version = "1.0.1"$/const Version = "2.0.0"/' version.go
            sed -i 's/\*\*Stable release:\*\* `v1.0.1`/**Stable release:** `v2.0.0`/' README.md

            python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); t=p.read_text(); marker="All notable changes to this project are documented here. The project follows Semantic Versioning.\n"; section="\n## [2.0.0] - 2026-08-06\n\n### Changed\n\n- Moved the canonical Go module to `github.com/sevlumen/oashttp/v2` after the repository transfer and rename.\n- Updated internal imports, examples, badges, installation instructions, and repository links to the canonical location.\n\n### Migration\n\nVersion 2 is a breaking module-path migration. Replace imports from `github.com/quang020102/go-osm` with `github.com/sevlumen/oashttp/v2`. Version `v1.0.1` remains available at the legacy module path.\n"; p.write_text(t if "## [2.0.0]" in t else t.replace(marker, marker+section, 1))'

            python3 -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(); anchor="The Go module has no third-party runtime dependencies."; section="## Migrating from v1\n\nVersion 2 uses the canonical module path `github.com/sevlumen/oashttp/v2`. Replace imports from `github.com/quang020102/go-osm`, then run:\n\n```bash\ngo get github.com/sevlumen/oashttp/v2@v2.0.0\ngo mod tidy\n```\n\nThe legacy `github.com/quang020102/go-osm@v1.0.1` module remains available for applications that are not ready to migrate.\n\n"; p.write_text(t if "## Migrating from v1" in t else t.replace(anchor, section+anchor, 1))'

            grep -qx 'module github.com/sevlumen/oashttp/v2' go.mod
            grep -qx 'const Version = "2.0.0"' version.go
            if git grep -n 'github.com/quang020102/go-osm' -- '*.go' go.mod '.github/**'; then
              echo "legacy module path remains in executable source"
              exit 1
            fi
            if git grep -n 'https://github.com/sevlumen/oashttp/v2'; then
              echo "repository URL incorrectly contains /v2"
              exit 1
            fi

            git rm .github/workflows/migrate-v2.yml
            rm -f MIGRATE_V2_FAILED.log
            git add -A
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "release: migrate canonical module path to v2.0.0"
            git push origin HEAD:main
          ) > /tmp/migrate-v2.log 2>&1
          status=$?
          set -e
          cat /tmp/migrate-v2.log

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/migrate-v2.log MIGRATE_V2_FAILED.log
            git add MIGRATE_V2_FAILED.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record v2 migration failure"
            git push origin HEAD:main
            exit "$status"
          fi
